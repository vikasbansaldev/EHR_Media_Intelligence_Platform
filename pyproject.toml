[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-media-intelligence"
version = "0.1.0"
description = "Ingest messy EHR media records, normalize to HL7 FHIR R4, summarize with an LLM, and search them semantically."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "fhir.resources>=8.0,<9",
    "fastapi>=0.111",
    # Plain uvicorn is pure Python; [standard] pulls PyYAML, which has no
    # Windows wheel for Python 3.15 yet. Install the "server" extra for speedups.
    "uvicorn>=0.30",
    "numpy>=1.26",
    # FAISS has no Python 3.15 wheels yet; there the NumPy backend (identical
    # exact cosine search) is used automatically. Install the "faiss" extra later.
    "faiss-cpu>=1.8; python_version < '3.15'",
    # Windows has no system time-zone database; zoneinfo reads it from tzdata.
    "tzdata>=2024.1; sys_platform == 'win32'",
    "anthropic>=0.40",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
server = ["uvicorn[standard]>=0.30"]
# all-MiniLM-L6-v2 embeddings. Pulls in torch, so it is optional: the
# offline hashing embedder is used automatically when it is missing.
ml = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ehr-intel = "ehr_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that exercise several pipeline stages",
    "performance: latency budget tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ehr_intel"]

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "sentence_transformers", "fhir.resources.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ehr_intel"]
branch = true
